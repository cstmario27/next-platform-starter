<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💘</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    text-align: center;
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h1 {
    font-size: 1.7em;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 1.2em;
    color: #ff4d6d;
    margin-bottom: 20px;
  }

  .buttons {
    position: relative;
    height: 120px;
  }

  button {
    padding: 12px 24px;
    font-size: 1.1em;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  #yesBtn {
    background: #ff4d6d;
    color: white;
  }

  #noBtn {
    background: #ccc;
    position: absolute;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
  }

  .result {
    display: none;
    margin-top: 20px;
  }

  .result img {
    width: 100%;
    border-radius: 15px;
    margin-top: 10px;
  }

  .heart {
    position: fixed;
    font-size: 22px;
    animation: float 2s linear forwards;
  }

  @keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-160px); opacity: 0; }
  }
</style>
</head>

<body>

<div class="container">
  <h1>Maria Pălăduță 💖</h1>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 🙄</button>
  </div>

  <div class="result" id="result">
    <p><strong>It's us 🥰</strong></p>
    <img src="us.jpg" alt="Us together">
  </div>
</div>

<!-- Sounds -->
<audio id="yesSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_9d8b8c1b8f.mp3"></audio>
<audio id="noSound" src="https://cdn.pixabay.com/audio/2022/03/10/audio_2f5f8a4a7f.mp3"></audio>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const result = document.getElementById("result");
  const yesSound = document.getElementById("yesSound");
  const noSound = document.getElementById("noSound");

  noBtn.addEventListener("mouseenter", moveNo);
  noBtn.addEventListener("touchstart", moveNo);

  function moveNo() {
    noSound.play();
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }

  yesBtn.addEventListener("click", () => {
    yesSound.play();
    result.style.display = "block";
    for (let i = 0; i < 35; i++) {
      createHeart();
    }
  });

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "0px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2000);
  }
</script>

</body>
</html>
